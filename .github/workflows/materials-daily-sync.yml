name: Daily material sync
on:
  schedule:
    - cron: '*/5 * * * *' # Cheap DB due/queue check; crawler runs only when due (72h) or requested.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legendstudy-material-sync-production
  cancel-in-progress: false
jobs:
  sync:
    if: vars.MATERIAL_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: material-sync-production
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/requirements-material-sync.txt
      - name: Verify Supabase TLS root
        run: |
          curl --fail --silent --show-error --location https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt -o /tmp/legendstudy-material-sync-ca.crt
          echo '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  /tmp/legendstudy-material-sync-ca.crt' | sha256sum --check
      - name: Offline contract checks
        run: python -m unittest discover -s tool -p 'test_*sync*.py'
      - name: Reconcile source and Registry
        env:
          MATERIAL_SYNC_DATABASE_URL: ${{ secrets.MATERIAL_SYNC_DATABASE_URL }}
        run: python tool/run_daily_material_sync.py --apply
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('daily-sync-report.json')
          r=json.loads(path.read_text()) if path.exists() else {'status':'runner_failed_before_report'}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Material sync\n\n'+json.dumps({k:r.get(k) for k in ('run_id','status','started_at','finished_at','counts','new_deferred')},ensure_ascii=False)+'\n')
          PY
