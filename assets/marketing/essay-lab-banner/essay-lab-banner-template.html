<!-- ============================================================= -->
<!-- LegendStudy 논술 LAB 홍보 배너 (게시글 삽입용 템플릿) v2        -->
<!-- 삽입 위치: 게시글 도입부 아래 · 기출 PDF 안내 "위"              -->
<!-- 치환: {{...}} 토큰만 교체. 구조/CSS/혜택문구는 통일 유지.       -->
<!--   {{UNIV_NAME}}   예: 한양대학교                                -->
<!--   {{HEADLINE}}    ≤2줄. 예: 한양대 논술, 온라인에서 무료로 첨삭받으세요. -->
<!--   {{SUBCOPY}}     1줄 간결 설명. 예: 대학별 평가 기준으로 내 답안의 부족한 부분을 확인하세요. -->
<!--   {{CTA_LABEL}}   예: 한양대 논술 첨삭받기 →                     -->
<!--   {{LAB_URL}}     예: https://lab.legendstudy.com/essay-lab/universities/hanyang/ -->
<!--                   (딥링크 미지원이면 https://lab.legendstudy.com/essay-lab/ 사용) -->
<!--   {{UNIV_ID}}     대학 slug/ID. 예: hanyang                     -->
<!--   {{POST_ID}}     게시글 식별자(임의).                          -->
<!--   {{CAMPAIGN_ID}} 예: essaylab_2026                             -->
<!-- 혜택 문구("신규가입 무료 첨삭 3회 · 웹·앱 모두 이용")는 상시정책 → 전 대학 공통(수정 금지). -->
<!-- ============================================================= -->
<!-- LS-ESSAY-BANNER:START -->
<section class="lseb-wrap" role="complementary" aria-label="{{UNIV_NAME}} 논술 LAB 안내">
  <style>
  .lseb-wrap{all:initial;display:block;margin:20px 0;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;text-align:center}
  .lseb-wrap *{box-sizing:border-box;margin:0;padding:0}
  .lseb-card{position:relative;display:flex;align-items:center;gap:18px;text-align:left;background:#1D3557;border:1px solid rgba(255,255,255,.12);border-left:4px solid #16A765;border-radius:14px;box-shadow:0 6px 18px rgba(13,30,55,.18);padding:18px 20px;max-width:620px;margin:0 auto}
  .lseb-main{flex:1 1 auto;min-width:0}
  .lseb-univ{display:inline-block;font-size:12px;font-weight:800;color:#FFFFFF;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 11px;letter-spacing:-.01em;margin-bottom:10px}
  .lseb-head{font-size:17px;font-weight:800;color:#FFFFFF;line-height:1.35;letter-spacing:-.02em;word-break:keep-all}
  .lseb-sub{margin-top:7px;font-size:13px;font-weight:400;color:#CBD5E1;line-height:1.55;word-break:keep-all}
  .lseb-sub .lseb-key{color:#FFFFFF;font-weight:700}
  .lseb-benefit{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#ECFDF5;background:#174C43;border-radius:8px;padding:6px 12px;line-height:1.35;letter-spacing:.1px;word-break:keep-all}
  .lseb-benefit .dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#34D399}
  .lseb-action{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
  .lseb-brand{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:rgba(255,255,255,.72);letter-spacing:.02em;white-space:nowrap}
  .lseb-brand .bdot{width:5px;height:5px;border-radius:1.5px;background:#16A765}
  .lseb-cta{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#16A765;color:#FFFFFF;font-size:14px;font-weight:800;line-height:1.2;letter-spacing:-.01em;border-radius:11px;padding:13px 18px;white-space:nowrap;box-shadow:0 1px 3px rgba(13,30,55,.18);transition:background .15s}
  .lseb-cta:link,.lseb-cta:visited{color:#FFFFFF;text-decoration:none}
  .lseb-cta:hover{background:#138A55}
  .lseb-cta:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
  @media (max-width:560px){
    .lseb-card{flex-direction:column;align-items:stretch;gap:14px;padding:18px;max-width:100%}
    .lseb-benefit{width:100%;justify-content:center}
    .lseb-action{width:100%}
    .lseb-cta{width:100%;padding:14px 16px;font-size:15px}
    .lseb-head{font-size:16px}
  }
  </style>
  <div class="lseb-card">
    <div class="lseb-main">
      <span class="lseb-univ">{{UNIV_NAME}} 논술 LAB</span>
      <p class="lseb-head">{{HEADLINE}}</p>
      <p class="lseb-sub"><span class="lseb-key">대학별 평가 기준</span>으로 내 답안의 부족한 부분을 확인하세요.</p>
      <span class="lseb-benefit"><span class="dot"></span>신규가입 무료 첨삭 3회 · 웹·앱 모두 이용</span>
    </div>
    <div class="lseb-action">
      <span class="lseb-brand"><span class="bdot"></span>LegendStudy LAB</span>
      <a class="lseb-cta"
         href="{{LAB_URL}}?utm_source=tistory&utm_medium=post_banner&utm_campaign={{CAMPAIGN_ID}}&utm_content={{UNIV_ID}}_{{POST_ID}}"
         target="_blank" rel="noopener noreferrer"
         data-lseb-univ="{{UNIV_ID}}" data-lseb-post="{{POST_ID}}" data-lseb-campaign="{{CAMPAIGN_ID}}">{{CTA_LABEL}}</a>
    </div>
  </div>
  <script>
  (function(){
    var root = document.currentScript && document.currentScript.closest('.lseb-wrap');
    if(!root || root.__lsebInit) return; root.__lsebInit = true;
    var cta = root.querySelector('.lseb-cta');
    function track(name, extra){
      try{
        var p = {send_to:"G-295EQHYTCK",
          university_id: cta.getAttribute('data-lseb-univ'),
          post_id: cta.getAttribute('data-lseb-post'),
          placement: "post_top_above_pdf",
          campaign_id: cta.getAttribute('data-lseb-campaign')};
        if(extra) for(var k in extra) p[k]=extra[k];
        if(typeof window.gtag==="function"){ window.gtag("event", name, p); }
        else { window.dataLayer=window.dataLayer||[]; (function(){window.dataLayer.push(arguments);})("event", name, p); }
      }catch(e){}
    }
    var fired=false;
    function impress(){ if(fired) return; fired=true; track("lab_banner_impression"); }
    if("IntersectionObserver" in window){
      var io=new IntersectionObserver(function(es){es.forEach(function(e){ if(e.isIntersecting){ impress(); io.disconnect(); }});},{threshold:.5});
      io.observe(root);
    } else { impress(); }
    if(cta) cta.addEventListener("click", function(){ track("lab_banner_click"); });
  })();
  </script>
</section>
<!-- LS-ESSAY-BANNER:END -->
