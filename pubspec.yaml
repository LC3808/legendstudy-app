name: legendstudy_app
description: Native LegendStudy mobile application scaffold.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3
  flutter: '>=3.47.3'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  supabase_flutter: ^2.15.4
  url_launcher: ^6.3.2
  http: ^1.6.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  image_picker: ^1.2.3
  pdfrx: ^2.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/generated/legendstudy_wordmark_header.png
    - assets/auth/google.png
    - assets/auth/kakao.png
